name: ACEest Fitness CI Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "docs/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-lint-test:
    name: Build, Lint, Docker and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate Python syntax
        run: |
          python -m compileall app.py tests

      - name: Run Ruff linting
        run: |
          ruff check .

      - name: Build Docker test image
        run: |
          docker build \
            --target test \
            --tag aceest-fitness:test \
            .

      - name: Execute Pytest inside Docker
        run: |
          docker run --rm aceest-fitness:test \
            pytest -v --cov=app --cov-report=term-missing

      - name: Build final Docker runtime image
        run: |
          docker build \
            --target runtime \
            --tag aceest-fitness:${{ github.sha }} \
            .

      - name: Verify application container
        run: |
          docker run --detach \
            --name aceest-fitness-ci \
            --publish 5000:5000 \
            aceest-fitness:${{ github.sha }}

          for attempt in {1..15}; do
            if curl --fail http://localhost:5000/health; then
              exit 0
            fi

            sleep 2
          done

          docker logs aceest-fitness-ci
          exit 1

      - name: Clean up container
        if: always()
        run: |
          docker rm --force aceest-fitness-ci 2>/dev/null || true